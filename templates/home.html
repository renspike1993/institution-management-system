<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CodeMirror Python Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css" />
    <style>
        .editor {
            height: 320px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <h2>Editable Python (CodeMirror)</h2>
    <textarea id="code" name="code">
# Type Python here
def add(a, b):
    return a + b

print(add(2, 3))
  </textarea>
    <button id="get">Get code</button>
    <pre id="out"></pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/python/python.min.js"></script>
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById('code'), {
            mode: "text/x-python",
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            matchBrackets: true,
            autofocus: true
        });




        document.getElementById('get').addEventListener('click', function () {
            document.getElementById('out').textContent = editor.getValue();
            alert(editor)
        });
    </script>
</body>

</html>
